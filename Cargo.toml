[workspace]
resolver = "3"
members = [
    "crates/todone-core",
    "crates/todone-forge",
    "crates/todone-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fonta/todone"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ignore = "0.4"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-language = "0.1"
unicode-width = "0.2"
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
